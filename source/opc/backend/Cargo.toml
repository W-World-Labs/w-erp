[package]
name = "opc"
version = "1.0.8"
edition = "2024"
license = "MIT"
autotests = false

[[bin]]
name = "opc-server"
path = "src/main.rs"

[[bin]]
name = "opc"
path = "src/cli_main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower-sessions = "0.14"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["macros", "runtime-tokio", "sqlite"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
imap = { version = "2.4.1", default-features = false }
mailparse = "0.16.1"
webpki-roots = "1"

# HTTP client (for OAuth)
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Shared fleet HTTP kit — standard reqwest::Client (timeout + obscura UA + pool).
# Used by the DaaS integration client; returns bare reqwest types (reqwest 0.12).
w-http = { version = "=0.2.1", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913" }
# Shared fleet MIME map — one tested superset table replacing the inline
# `match ext { … }` in src/api/files.rs (case-insensitive; a strict superset of
# OPC's previous case-sensitive 6-entry map).
w-util = { version = "=0.1.3", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913", features = ["mime"] }
mime_guess = "2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15"
urlencoding = "2"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
base64 = "0.22"
# Backup archive packing (issue #2)
tar = "0.4"
flate2 = "1"
xradar = { version = "=0.3.11", git = "https://github.com/W-World-Labs/w-radar", rev = "579174832c5de9a1b606f82084171b3965deae56", features = ["axum"] }
w-crypto = { version = "=0.1.1", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913", default-features = false, features = ["hash"] }
w-web-kit = { version = "=0.1.10", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913", features = ["health", "openapi", "spa", "cors"] }
# Shared OUTBOUND OpenAI-compatible model client (replaces the bespoke GLM
# chat/completions client in src/api/ai.rs). Default features give async chat.
w-maas-sdk = { version = "=0.4.3", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913" }
w-notify = { version = "=0.1.3", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913" }
# China e-invoice structured direct-read (XML / OFD / PDF text rules) — OCR quality #14.
w-einvoice = { version = "=0.1.1", git = "https://github.com/W-World-Labs/w-commons", rev = "f7eb2a85af8409340d094807c22ab7f24cf50913" }
# Optional PDF binary → text for structured-read-first on e-invoice PDFs.
pdf-extract = "0.12"
rust-embed = "8"

# PDF Generation (pure Rust)
genpdfi = "0.2"
# Disk free-space probes for /health
fs2 = "0.4"

# CLI
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"

[profile.release]
lto = true
strip = true

# This mature ERP still contains intentionally broad DTOs and SQL tuple shapes.
# Keep clippy fail-closed for new warnings while explicitly inventorying the
# legacy structural/style debt that is outside this dependency migration.
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"

[lints.clippy]
await_holding_lock = "allow"
bool_assert_comparison = "allow"
collapsible_if = "allow"
collapsible_str_replace = "allow"
empty_line_after_doc_comments = "allow"
manual_clamp = "allow"
manual_range_contains = "allow"
len_zero = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
too_many_arguments = "allow"
trim_split_whitespace = "allow"
type_complexity = "allow"
unnecessary_cast = "allow"
unnecessary_sort_by = "allow"
useless_vec = "allow"

[dev-dependencies]
axum-test = "18"
tower = { version = "0.5", features = ["util"] }
