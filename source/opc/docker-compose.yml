services:
  w-opc:
    build:
      context: ../..
      dockerfile: source/opc/Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8987}:8987"
    volumes:
      - w-opc-data:/app/data
    environment:
      - PORT=8987
      - BIND_HOST=0.0.0.0
      - DATABASE_URL=sqlite:data/database.sqlite?mode=rwc
      - RUST_LOG=info
      # Required: OAuth configuration
      - W_ID_SSO_URL=${W_ID_SSO_URL:-https://auth.myfastools.com}
      - W_ID_CLIENT_ID=${W_ID_CLIENT_ID:-}
      - W_ID_CLIENT_SECRET=${W_ID_CLIENT_SECRET:-}
      - W_ID_REDIRECT_URI=${W_ID_REDIRECT_URI:-http://localhost:8987/auth/callback}
      # Required for production: CORS whitelist
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8987,http://localhost:8080,http://localhost:5173}
      # Optional: Frontend URL for OAuth redirects
      - APP_URL=${APP_URL:-http://localhost:8987}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8987/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  w-opc-data:
